[workspace]
members = [
    "crates/cuttlefish-rs",
    "crates/cuttlefish-rs-cli",
    "crates/cuttlefish-rs-compat-tests",
]
resolver = "2"

[workspace.package]
# One version for the whole workspace; every member inherits it, and
# `scripts/bump_and_publish.sh` rewrites this single line. The 0.0.x versions
# on crates.io are not releases -- they exist to hold the names, and to prove
# the publish path works. The first real release is 0.1.0.
version = "0.0.1"
edition = "2024"
license = "BSD-3-Clause"
rust-version = "1.88"
repository = "https://github.com/COMBINE-lab/cuttlefish"
homepage = "https://github.com/COMBINE-lab/cuttlefish"
keywords = ["bioinformatics", "de-bruijn-graph", "genomics", "unitig", "k-mer"]
# The CLI crate adds "command-line-utilities" to this on top.
categories = ["science"]

[workspace.dependencies]
# Path plus version: the path is what a local `cargo build` resolves, the
# version is what the published crate requires. `bump_and_publish.sh` keeps the
# version here in step with [workspace.package].
cuttlefish-rs = { path = "crates/cuttlefish-rs", version = "0.0.1" }

[profile.release]
codegen-units = 8
panic = "abort"
