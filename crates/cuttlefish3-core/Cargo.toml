[package]
name = "cuttlefish3-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "cuttlefish3_core"
path = "src/lib.rs"

[dependencies]
flate2 = "1"
hashbrown = { version = "0.16.1", features = ["raw-entry"] }
leapfrog = { version = "0.3.3", features = ["stable_alloc"] }
rayon = "1.12.0"
scc = "3.8.4"
