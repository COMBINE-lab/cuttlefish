[workspace]
members = [
    "crates/cuttlefish-rs",
    "crates/cuttlefish-rs-cli",
    "crates/cuttlefish-rs-compat-tests",
]
resolver = "2"

[workspace.package]
# One version for the whole workspace; every member inherits it, and
# `scripts/bump_and_publish.sh` rewrites it (here and on the cuttlefish-rs
# entry in [workspace.dependencies] below). The major version tracks the
# product generation -- 3.x is Cuttlefish 3 -- so a backward-incompatible
# change bumps the minor version; see CHANGELOG.md.
version = "3.0.0"
edition = "2024"
license = "BSD-3-Clause"
rust-version = "1.91"
repository = "https://github.com/COMBINE-lab/cuttlefish"
homepage = "https://github.com/COMBINE-lab/cuttlefish"
keywords = ["bioinformatics", "de-bruijn-graph", "genomics", "unitig", "k-mer"]
# The CLI crate adds "command-line-utilities" to this on top.
categories = ["science"]

[workspace.dependencies]
# Path plus version: the path is what a local `cargo build` resolves, the
# version is what the published crate requires. `bump_and_publish.sh` keeps the
# version here in step with [workspace.package].
cuttlefish-rs = { path = "crates/cuttlefish-rs", version = "3.0.0" }

[profile.release]
codegen-units = 8
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
