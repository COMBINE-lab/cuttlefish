[package]
name = "cuttlefish-rs"
description = """
Parallel, external-memory construction of uncolored and colored compacted \
de Bruijn graphs. The Cuttlefish 3 library.\
"""
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "cuttlefish_rs"
path = "src/lib.rs"

[dependencies]
# `zlib-rs` is the pure-Rust port of zlib-ng; it decompresses substantially
# faster than flate2's default `miniz_oxide` backend on gzipped FASTQ input.
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
hashbrown = { version = "0.16.1", features = ["raw-entry"] }
# Bucket blocks use only `lz4_flex::block`, so the frame module and its
# twox-hash dependency are dropped.
#
# `safe-encode` is off. The encoder runs on buffers this crate just built, so
# the exposure is a bug in lz4_flex rather than malformed input, and the unsafe
# path is consistently faster across unlike payloads -- 972 to 1068 MB/s on
# reference buckets, 752 to 850 MB/s on read buckets -- overtaking the C liblz4
# the C++ build links (1023 and 829 MB/s) in both cases.
#
# Decoding keeps `safe-decode` and `checked-decode`: a bucket truncated by a
# killed run is a realistic input, and unsafe decode adds nothing to
# compression throughput.
lz4_flex = { version = "0.11", default-features = false, features = [
    "std",
    "safe-decode",
    "checked-decode",
] }
# Bindings only, and already linked: std itself goes through libc on Linux.
# Used for `fallocate(FALLOC_FL_PUNCH_HOLE)`, which has no std equivalent and
# is what lets a consumed bucket release its segments from a shared container.
libc = "0.2"
rayon = "1.12.0"
scc = "3.8.4"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
rapidgzip-core = { version = "0.3.1", features = ["busy-time-accounting"] }
thread-broker = "0.1.0"
crossbeam-utils = "0.8.22"
